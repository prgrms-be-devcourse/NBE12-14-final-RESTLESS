name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: read

# A new push to the same PR cancels the older run. Runs on main/dev are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      # PR에서 백엔드 파일과 워크플로가 바뀌지 않았으면 빌드 단계만 건너뛴다. job은 그대로 성공으로 남는다.
      # merge-gate.py가 backend 검사 결과를 보므로 job 자체를 건너뛰지 않는다. dev와 main push는 항상 전체를 돈다.
      - name: Detect changes
        id: changes
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')"
          if printf '%s\n' "$files" | grep -qE '^(backend/|\.github/workflows/)'; then run=true; else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = false ]; then echo "::notice::No backend/ or workflow change in this PR, so the backend build is skipped."; fi
      - uses: actions/checkout@v4
        if: steps.changes.outputs.run == 'true'
      - uses: actions/setup-java@v4
        if: steps.changes.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.changes.outputs.run == 'true'
      - run: ./gradlew build
        if: steps.changes.outputs.run == 'true'
      # Keeps expected/actual values and stack traces that the job log does not show.
      # Uploaded on success too: an independent verifier counts tests from it instead of rebuilding.
      - uses: actions/upload-artifact@v4
        if: always() && steps.changes.outputs.run == 'true'
        with:
          name: backend-test-results
          path: |
            backend/build/reports/tests/test/
            backend/build/test-results/test/
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      # backend job과 같은 방식이다. 프론트엔드 파일과 워크플로가 바뀌지 않은 PR은 빌드 단계만 건너뛴다.
      - name: Detect changes
        id: changes
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')"
          if printf '%s\n' "$files" | grep -qE '^(frontend/|\.github/workflows/)'; then run=true; else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = false ]; then echo "::notice::No frontend/ or workflow change in this PR, so the frontend build is skipped."; fi
      - uses: actions/checkout@v4
        if: steps.changes.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: steps.changes.outputs.run == 'true'
      - run: npm run build
        if: steps.changes.outputs.run == 'true'
