name: Backend image

# dev에 push되어 CI가 통과한 커밋만 이미지로 만든다. 테스트는 CI가 이미 돌렸으므로 여기서는 다시 돌리지 않는다.
# 수동 실행은 아무 브랜치나 고를 수 있다. 부하 테스트에서 개선 전후 이미지를 머지 없이 만들 때 쓴다.
# PR에서는 Dockerfile이 빌드되는지만 확인하고 올리지 않는다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
  pull_request:
    paths:
      - backend/Dockerfile
      - backend/.dockerignore
      - .github/workflows/backend-image.yml

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # GHCR 이미지 이름은 소문자만 허용한다.
  IMAGE: ghcr.io/prgrms-be-devcourse/nbe12-14-final-restless-backend

jobs:
  image:
    # workflow_run은 CI가 성공했고, PR이 아닌 dev push로 돌았을 때만 진행한다.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve commit
        id: ref
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_run) sha="$RUN_SHA"; branch="$RUN_BRANCH" ;;
            pull_request) sha="$PR_SHA"; branch="" ;;
            *) sha="$GITHUB_SHA"; branch="$GITHUB_REF_NAME" ;;
          esac
          tags="$IMAGE:sha-${sha:0:12}"
          # dev 태그는 dev 브랜치 이미지에만 붙인다. 서버는 이 태그나 sha 태그로 받는다.
          if [ "$branch" = "dev" ]; then tags="$tags,$IMAGE:dev"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # EC2 t3.small이 x86이라 amd64만 만든다.
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.ref.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - if: github.event_name != 'pull_request'
        name: Summary
        env:
          TAGS: ${{ steps.ref.outputs.tags }}
        run: |
          echo "### Pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" | tr ',' '\n' | sed 's/^/- `/; s/$/`/' >> "$GITHUB_STEP_SUMMARY"
