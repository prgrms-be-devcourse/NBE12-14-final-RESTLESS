# 로컬 개발용 MySQL
# ./gradlew bootRun 이면 Spring Boot가 자동으로 기동/정지한다.
# 직접 띄우려면 backend 폴더에서 docker compose up -d
name: restless

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: restless
      MYSQL_USER: restless
      MYSQL_PASSWORD: restless
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data: