# 로컬 개발용 MySQL: backend 폴더에서 docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: restless
      MYSQL_USER: restless
      MYSQL_PASSWORD: restless
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
