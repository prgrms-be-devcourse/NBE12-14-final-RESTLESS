# 모든 환경 공통 설정. 환경별 값은 application-dev.yml, application-prod.yml에 둔다.
# 프로필을 지정하지 않으면 dev로 실행된다. 배포에서는 SPRING_PROFILES_ACTIVE=prod를 반드시 지정한다.
spring:
  application:
    name: restless
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    out-of-order: true
  task:
    scheduling:
      pool:
        # 모든 @Scheduled 작업이 같이 쓰는 실행기의 스레드 수. 기본값 1이면 결제 대사가 PG 응답을 기다리는 동안
        # 경매 시작·종료 같은 다른 작업이 실행되지 못한다 (#315). 같은 작업은 fixedDelay라 겹쳐 돌지 않는다.
        size: 4

restless:
  ratelimit:
    enabled: true
    maximum-size: 10000
    expire-after-access: 2m
    login:
      limit: 20
      window: 1m
    signup:
      limit: 10
      window: 1m
    refresh:
      limit: 30
      window: 1m
    queue-entry:
      limit: 5
      window: 10s
    queue-status:
      limit: 5
      window: 1s
  drop:
    inventory:
      # ADR-0005: stock buckets per new SKU, min(this, total). 1..16, read only at creation.
      bucket-count: 4
    queue:
      required: true
      heartbeat-timeout: 40s
      # heartbeat-interval defaults to 10s (timeout / 4 for shorter timeouts).
      admission-ttl: 5m
      admit-per-run: 100
      # 2026-11-24 사용자 위임 결정 (#390): 서버가 알려 주는 다음 조회 간격.
      # 순번이 up-to-position 이하인 첫 구간의 after-ms, 없으면 fallback-ms. 어떤 값도 max-ms를 넘지 않는다.
      # max-ms를 쓰지 않으면 min(10000, heartbeat-interval, heartbeat-timeout / 3)이다.
      # 직접 쓰면 heartbeat-interval 이하이고 heartbeat-timeout 안에 3번 이상 들어와야 하며, 어기면 기동이 실패한다.
      poll:
        tiers:
          - { up-to-position: 20, after-ms: 1000 }
          - { up-to-position: 200, after-ms: 2000 }
          - { up-to-position: 1000, after-ms: 3000 }
        fallback-ms: 5000
      # 서버 한 대에서 진입, 상태 조회를 동시에 처리하는 수의 상한. 넘으면 바로 503 DROP_QUEUE_BUSY.
      # 근거: Hikari 풀 20, Tomcat 스레드 200. 진입은 트랜잭션 동안 커넥션을 쥐므로 풀의 40%,
      # 조회는 커넥션을 짧게 빌리므로 30. 합 38은 Tomcat 200 대비 작아 TX1, 결제 스레드를 남긴다.
      concurrency:
        entry-max: 8
        status-max: 30
        # 진입 Retry-After x 진입 요청 횟수 제한(10초당 5회)이 제한 창 이상이어야 한다. 어기면 기동이 실패한다.
        entry-retry-after-seconds: 5
        status-retry-after-seconds: 1
      scheduler:
        enabled: true
        fixed-delay-ms: 1000
  payment:
    reconcile:
      enabled: ${PAYMENT_RECONCILE_ENABLED:true}
      fixed-delay-ms: 5000
      batch-size: 100
      processing-stale-after: 30s
      unknown-retry-after: 10s
      cancel-stale-after: 30s
      not-found-final-after: 15m
  auth:
    withdrawn-block:
      # 탈퇴한 회원의 쓰기 요청을 막는다. 쓰기마다 회원을 한 번 조회하므로 perf 프로필에서는 끈다.
      enabled: true
    jwt:
      # HS256 서명 키, 32바이트 이상. dev는 application-dev.yml에 기본값이 있고, prod는 환경변수로만 넣는다.
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}
    refresh:
      ttl: ${REFRESH_TOKEN_TTL:P7D}
      cookie-name: refresh_token
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: Strict
  auction:
    scheduler:
      # 경매 시작·종료 스케줄러. 테스트에서는 build.gradle이 false로 끈다.
      enabled: ${AUCTION_SCHEDULER_ENABLED:true}
      # 한 번 처리한 뒤 다음 실행까지 쉬는 시간(ms)
      fixed-delay-ms: 1000
      # 한 번에 처리할 경매 수
      batch-size: 100
    stream:
      # 경매별로 변경을 모아 최신 상태를 보내는 간격(ms). policy.md 8절
      flush-interval-ms: 200
      # SSE 연결 최대 유지 시간(ms). 지나면 서버가 닫고, 클라이언트는 상세를 다시 받은 뒤 재연결한다.
      timeout-ms: 1800000
      # 서버 전체 SSE 연결 상한 (#244). 넘으면 새 연결만 503 AUCTION_STREAM_BUSY로 거절하고 기존 연결은 그대로 둔다.
      # 근거: 연결당 힙 약 120KB(2026-11-18 측정), 힙 한도 약 1,200MB에서 입찰 몰림용 약 300MB를 남긴다 (policy.md 8절).
      max-connections: ${AUCTION_STREAM_MAX_CONNECTIONS:6000}
      # 거절 응답의 Retry-After(초). 클라이언트는 그동안 상세 API로 가격을 보여 준다.
      retry-after-seconds: 5
      # 모든 연결에 내용 없는 주석을 보내는 간격(ms) (#447). 서버는 써 봐야 떠난 클라이언트를 알 수 있으므로,
      # 입찰이 없는 경매에서도 떠난 연결을 이 간격의 약 2배 안에 정리한다. 앞단 프록시의 무응답 끊김(보통 60초)도 막는다.
      heartbeat-interval-ms: 15000
      # 관전 중인 경매의 revision을 DB에서 확인하는 간격(ms) (ADR-0007). 서버가 여러 대일 때 다른 서버가 바꾼 경매를
      # 이 서버의 관전자에게 보내고 조회 캐시를 버린다. 0이면 끈다 (서버 한 대). 서버당 이 간격마다 기본 키 조회 한 번이다.
      revision-poll-interval-ms: ${AUCTION_STREAM_REVISION_POLL_INTERVAL_MS:500}
    query-cache:
      # 목록·상세 조회의 앱 메모리 캐시. 변경 이벤트로 상세를 즉시 갱신한다.
      enabled: true
      ttl-ms: 1000
  fanmeeting:
    worker:
      # 팬미팅 응모 기간 열기·마감, 추첨 Worker. 테스트에서는 build.gradle이 false로 끈다.
      enabled: ${FANMEETING_WORKER_ENABLED:true}
      fixed-delay-ms: 1000
      draw-fixed-delay-ms: 5000
      # 주문 만료, 보류 30분 경고
      expiry-fixed-delay-ms: 60000
      # 예비 승격, 모집 완료
      promotion-fixed-delay-ms: 30000
      # 한 번에 처리할 행사·추첨·주문 수
      batch-size: 100
    eligibility:
      # 행사 공지 시각 이후 가입한 회원의 응모를 막는다. 기본 꺼짐 (policy.md 7절).
      joined-at-check:
        enabled: ${FANMEETING_JOINED_AT_CHECK_ENABLED:false}

logging:
  pattern:
    # 로그 줄마다 traceId를 찍는다. 오류 응답의 traceId로 그 요청의 로그를 찾는다 (common/web/TraceIdFilter).
    correlation: "[%X{traceId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info
