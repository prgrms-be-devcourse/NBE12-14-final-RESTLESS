# 모든 환경 공통 설정. 환경별 값은 application-dev.yml, application-prod.yml에 둔다.
# 프로필을 지정하지 않으면 dev로 실행된다. 배포에서는 SPRING_PROFILES_ACTIVE=prod를 반드시 지정한다.
spring:
  application:
    name: restless
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    out-of-order: true

restless:
  auth:
    jwt:
      # HS256 서명 키, 32바이트 이상. dev는 application-dev.yml에 기본값이 있고, prod는 환경변수로만 넣는다.
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}
    refresh:
      ttl: ${REFRESH_TOKEN_TTL:P7D}
      cookie-name: refresh_token
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: Strict

management:
  endpoints:
    web:
      exposure:
        include: health,info
