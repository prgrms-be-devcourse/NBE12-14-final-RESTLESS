# 모든 환경 공통 설정. 환경별 값은 application-dev.yml, application-prod.yml에 둔다.
# 프로필을 지정하지 않으면 dev로 실행된다. 배포에서는 SPRING_PROFILES_ACTIVE=prod를 반드시 지정한다.
spring:
  application:
    name: restless
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    out-of-order: true

restless:
  drop:
    queue:
      required: true
      heartbeat-timeout: 30s
      admission-ttl: 5m
      admit-per-run: 100
      scheduler:
        enabled: true
        fixed-delay-ms: 1000
  payment:
    reconcile:
      enabled: ${PAYMENT_RECONCILE_ENABLED:true}
      fixed-delay-ms: 5000
      batch-size: 100
      processing-stale-after: 30s
      unknown-retry-after: 10s
      cancel-stale-after: 30s
      not-found-final-after: 15m
  auth:
    jwt:
      # HS256 서명 키, 32바이트 이상. dev는 application-dev.yml에 기본값이 있고, prod는 환경변수로만 넣는다.
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}
    refresh:
      ttl: ${REFRESH_TOKEN_TTL:P7D}
      cookie-name: refresh_token
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: Strict
  auction:
    scheduler:
      # 경매 시작·종료 스케줄러. 테스트에서는 build.gradle이 false로 끈다.
      enabled: ${AUCTION_SCHEDULER_ENABLED:true}
      # 한 번 처리한 뒤 다음 실행까지 쉬는 시간(ms)
      fixed-delay-ms: 1000
      # 한 번에 처리할 경매 수
      batch-size: 100

logging:
  pattern:
    # 로그 줄마다 traceId를 찍는다. 오류 응답의 traceId로 그 요청의 로그를 찾는다 (common/web/TraceIdFilter).
    correlation: "[%X{traceId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info
