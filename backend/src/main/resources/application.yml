spring:
  application:
    name: restless
  config:
    import: optional:file:.env.local[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/restless}
    username: ${DB_USERNAME:restless}
    password: ${DB_PASSWORD:restless}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    out-of-order: true

toss:
  secret-key: ${TOSS_SECRET_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
