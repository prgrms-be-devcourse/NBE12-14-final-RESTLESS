# 모든 환경 공통 설정. 환경별 값은 application-dev.yml, application-prod.yml에 둔다.
# 프로필을 지정하지 않으면 dev로 실행된다. 배포에서는 SPRING_PROFILES_ACTIVE=prod를 반드시 지정한다.
spring:
  application:
    name: restless
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    out-of-order: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
