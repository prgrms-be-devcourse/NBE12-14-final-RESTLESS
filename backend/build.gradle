plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.restless'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // 부하 테스트 지표. perf 프로필에서만 /actuator/prometheus를 연다 (application-perf.yml)
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    // 모듈 경계 규칙 테스트 (결제·주문·드롭 패키지에만 적용, architecture/OwnedModuleBoundaryTest)
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // 테스트 클래스를 JVM 여러 개에 나눠 돌린다. 포크마다 자기 MySQL 컨테이너를 띄우므로 데이터가 섞이지 않는다.
    // 코어의 절반만 쓴다. 나머지는 포크마다 하나씩 뜨는 MySQL 몫이다. CI 러너는 4코어라 2개가 된다.
    maxParallelForks = Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))
    // 경매 시작·종료 스케줄러는 테스트에서 끈다. 다른 테스트의 데이터 정리와 겹치지 않게 하기 위해서다.
    // 스케줄러를 검증하는 테스트만 @SpringBootTest(properties)로 다시 켠다.
    systemProperty 'restless.auction.scheduler.enabled', 'false'
    // 요청 제한은 이를 검증하는 테스트에서만 명시적으로 켠다.
    systemProperty 'restless.ratelimit.enabled', 'false'
    // 기존 테스트는 DB를 직접 바꾼다. 경매 조회 캐시는 AuctionQueryCacheTest에서만 켠다.
    systemProperty 'restless.auction.query-cache.enabled', 'false'
    // 배치 좌석 위치 캐시도 같은 이유로 끈다. TicketSeatQueryApiTest, LayoutSeatPositionCacheTest에서만 켠다.
    systemProperty 'restless.concert.layout-cache.enabled', 'false'
    systemProperty 'restless.payment.reconcile.enabled', 'false'
    systemProperty 'restless.drop.expiry.enabled', 'false'
    // JDBC Timestamp fixtures and JPA TIMESTAMP_UTC must use the same time zone on every host.
    systemProperty 'user.timezone', 'UTC'
    // Each cached Spring context keeps its own database in the shared MySQL container (TestcontainersConfiguration).
    systemProperty 'spring.test.context.cache.maxSize', '4'
    systemProperty 'restless.drop.queue.scheduler.enabled', 'false'
    // 팬미팅 응모 기간 Worker도 같은 이유로 끈다. 워커 테스트는 FanMeetingEntryWorker를 직접 부른다.
    systemProperty 'restless.fanmeeting.worker.enabled', 'false'
}
