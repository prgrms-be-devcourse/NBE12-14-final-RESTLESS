# 부하 테스트 시드 수치. 값은 여기서만 바꾼다.
# 형식: 최상위 구역 아래 "키: 정수". 들여쓰기 2칸, 주석은 #. lib/scale.py가 읽는다 (PyYAML 불필요).
# common은 모든 스케일에 적용되고, 스케일 구역의 같은 키가 덮어쓴다.
# 핫 데이터 기준값(재고)은 고정값이다. 테스트 후 불변식 대조에 쓴다.

common:
  # 핫 이벤트 기본 경쟁률 N:1. 참여자 = 기준값 x 경쟁률, users 이하여야 한다.
  # 핫 이벤트는 빈 상태로 시작하므로 실제 참여자 수는 k6가 CSV 앞에서 몇 행을 쓰는지로 바꾼다.
  # base는 재고 1,000에 계정 100,000이라 10:1부터 100:1까지 다시 시드하지 않고 실험한다.
  contention_ratio: 10
  # 시드가 서명하는 Access Token, DB의 Refresh Token 유효 시간. 테스트 길이보다 길게 둔다.
  token_ttl_hours: 72
  # 핫 드롭 판매 기간. 시드 또는 --refresh 시각부터 센다.
  hot_window_hours: 24
  # 주최자 계정 수. 공연마다 돌아가며 판매자가 된다.
  auction_heavy_users: 100
  auction_heavy_auctions_per_user: 50
  auction_ending: 1
  auction_mass_close: 1000
  auction_mass_close_bids_per: 3
  auction_spread: 100
  auction_bg: 1000
  auction_bg_bids_per: 20
  auction_bg_pct_unsold: 10
  auction_start_price: 10000
  auction_min_increment: 100
  credit_grant: 100000000
  organizers: 10
  drop_hot_variants: 3
  drop_hot_price: 59000
  # 핫 드롭 대기열에 미리 넣을 WAITING 행 수. 0이면 대기열 등록 자체를 측정한다.
  drop_hot_queue_prefill: 0
  drop_bg_variants_per_drop: 3
  # 종료된 드롭 점유의 상태 비율(%). 나머지는 EXPIRED. restored가 환불 비율이다.
  drop_bg_pct_confirmed: 80
  drop_bg_pct_restored: 3
  drop_bg_pct_released: 7

# 로컬 확인용
small:
  auction_heavy_users: 10
  auction_heavy_auctions_per_user: 20
  auction_mass_close: 50
  auction_spread: 10
  auction_bg: 50
  users: 1000
  drop_hot_stock: 100
  drop_bg_drops: 5
  drop_bg_reservations: 1000

# 기본 실험 (EXP-01~04)
base:
  users: 100000
  drop_hot_stock: 1000
  drop_bg_drops: 100
  drop_bg_reservations: 100000

# 용량 측정 (계단식, perf/scenarios/drop-reservation-step.js)
# 재고가 1,000이면 높은 도착률에서 몇 초 만에 품절되어 품절 응답만 재게 된다. 성공 점유 경로의 처리량을 보려고
# 재고를 계획 도착 수(기본 계단 약 19만)보다 크게 둔다. 계정은 테스트에서 한 번씩만 쓰므로 계정 수도 같이 늘린다.
# 핫 SKU 3개, 배경 데이터 크기는 base와 같아서 행 경합과 테이블 크기 조건이 같다. 바뀌는 것은 재고 수량뿐이다.
capacity:
  users: 210000
  drop_hot_stock: 210000
  contention_ratio: 1
  drop_bg_drops: 100
  drop_bg_reservations: 100000

# 확장 실험
large:
  auction_heavy_users: 1000
  auction_mass_close: 10000
  auction_spread: 1000
  auction_bg: 10000
  users: 1000000
  drop_hot_stock: 100000
  drop_bg_drops: 1000
  drop_bg_reservations: 1000000
